<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

        /* Auth Screen */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 320px; text-align: center; }
        .auth-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 25px; }
        .auth-input { width: 100%; padding: 12px 16px; background: #1c1c1e; border: 1px solid #333; border-radius: 12px; color: #fff; margin-bottom: 12px; font-size: 0.95rem; outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .toggle-auth { margin-top: 15px; color: #8e8e93; font-size: 0.85rem; cursor: pointer; }

        /* Sidebar & App */
        #sidebar { width: 280px; background-color: #0d0d0d; height: 100%; display: flex; flex-direction: column; position: fixed; left: -280px; top: 0; transition: left 0.3s ease; z-index: 100; border-right: 1px solid #1a1a1a; padding: 15px; }
        #sidebar.open { left: 0; }
        .sidebar-header { font-size: 1.3rem; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; color: #ececec; cursor: pointer; font-size: 0.95rem; }
        .menu-item:hover { background-color: #1a1a1a; }
        .recents-title { color: #8e8e93; font-size: 0.8rem; margin: 20px 0 10px 10px; font-weight: 600; }
        .chat-history { flex: 1; overflow-y: auto; }
        .history-item { padding: 10px 12px; border-radius: 8px; color: #d1d1d6; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .user-profile { display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #1a1a1a; margin-top: auto; }
        .avatar { width: 32px; height: 32px; background: #3a3a3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 90; }
        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; width: 100%; }

        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #000000; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: none; border: none; color: #ffffff; font-size: 1.2rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .get-plus-btn { background: #1c1c1e; color: #d4bbff; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .welcome-screen { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 12px; padding-bottom: 20px; }
        .quick-btn { display: flex; align-items: center; gap: 12px; color: #ececec; font-size: 0.95rem; padding: 10px; background: #1c1c1e; border-radius: 12px; cursor: pointer; }

        .message { display: flex; flex-direction: column; max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; }
        .user-msg { background: #2c2c2e; align-self: flex-end; color: #ffffff; }
        .ai-msg { background: #121212; align-self: flex-start; color: #ececec; border: 1px solid #222; }
        .ai-msg img { max-width: 100%; border-radius: 12px; margin-top: 10px; }

        #input-area { padding: 12px 16px 20px 16px; background: #000000; }
        .input-box { background: #1c1c1e; border-radius: 28px; display: flex; align-items: center; padding: 6px 12px 6px 16px; gap: 10px; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 0.95rem; resize: none; height: 24px; max-height: 100px; }
        .voice-wave-btn { background: #1a73e8; color: #ffffff; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-title" id="auth-title">Welcome to Power AI</div>
            <input type="email" id="auth-email" class="auth-input" placeholder="Email address">
            <input type="password" id="auth-password" class="auth-input" placeholder="Password">
            <button class="auth-btn" onclick="handleAuth()">Continue</button>
            <div class="toggle-auth" onclick="toggleAuthMode()" id="toggle-text">Don't have an account? Sign up</div>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span>Power AI</span>
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="menu-item" onclick="quickSend('Create an image of a futuristic city')"><i class="fa-regular fa-image"></i> Images</div>
        <div class="menu-item"><i class="fa-solid fa-layer-group"></i> Library</div>
        <div class="menu-item"><i class="fa-regular fa-folder"></i> Projects</div>

        <div class="recents-title">Recents</div>
        <div class="chat-history" id="chat-history"></div>

        <div class="user-profile">
            <div class="avatar" id="user-avatar">U</div>
            <span style="font-size: 0.9rem;" id="user-name-display">User</span>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="main-content">
        <header>
            <div class="header-left">
                <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <button class="get-plus-btn"><i class="fa-solid fa-sparkles"></i> Get Plus</button>
            </div>
            <button class="icon-btn" onclick="clearChat()"><i class="fa-regular fa-pen-to-square"></i></button>
        </header>

        <div id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="quick-btn" onclick="quickSend('Create an image of a flying car')"><i class="fa-regular fa-image"></i> Create an image</div>
                <div class="quick-btn" onclick="quickSend('Write a video script idea')"><i class="fa-regular fa-pen-to-square"></i> Write or edit</div>
                <div class="quick-btn" onclick="quickSend('Search the web for latest AI news')"><i class="fa-solid fa-globe"></i> Search the web</div>
            </div>
        </div>

        <div id="input-area">
            <div class="input-box">
                <textarea id="user-input" placeholder="Ask Power AI" rows="1"></textarea>
                <button class="voice-wave-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        let isSignUp = false;

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Welcome to Power AI";
            document.getElementById('toggle-text').innerText = isSignUp ? "Already have an account? Log in" : "Don't have an account? Sign up";
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value;
            if (!email) return alert("Please enter email");
            
            const name = email.split('@')[0];
            document.getElementById('user-name-display').innerText = name;
            document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
            
            document.getElementById('auth-screen').style.display = 'none';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.remove();

            const chatContainer = document.getElementById('chat-container');

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            chatContainer.appendChild(userDiv);
            input.value = '';

            const history = document.getElementById('chat-history');
            const hItem = document.createElement('div');
            hItem.className = 'history-item';
            hItem.innerText = text;
            history.prepend(hItem);

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.innerText = 'Power AI विचार करत आहे...';
            chatContainer.appendChild(aiDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                if (data.reply.includes("![Generated Image]")) {
                    const imgUrl = data.reply.match(/\((.*?)\)/)[1];
                    aiDiv.innerHTML = `इमेज तयार झाली आहे:<br><img src="${imgUrl}" alt="Generated Image">`;
                } else {
                    aiDiv.innerText = data.reply;
                }
            } catch (e) {
                aiDiv.innerText = "सर्व्हरशी संपर्क होऊ शकला नाही.";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function quickSend(promptText) {
            document.getElementById('user-input').value = promptText;
            sendMessage();
        }

        function clearChat() {
            location.reload();
        }
    </script>
</body>
</html>
