
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Power AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #212121; color: #ececec; height: 100vh; overflow: hidden; position: relative; }

    .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #171717; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2f2f2f; z-index: 10; font-weight: 600; }
    .menu-btn { background: transparent; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }

    .chat-container { position: fixed; top: 50px; bottom: 85px; left: 0; right: 0; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
    .msg-wrapper { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
    .msg-wrapper.user { justify-content: flex-end; }

    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; flex-shrink: 0; }
    .user-avatar { background: #5436da; color: #fff; }
    .ai-avatar { background: #10a37f; color: #fff; }

    .msg-bubble { flex: 1; max-width: 85%; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
    .user .msg-bubble { background: #2f2f2f; padding: 10px 14px; border-radius: 18px; border-bottom-right-radius: 4px; text-align: left; }

    .code-container { background: #0d0d0d; border-radius: 8px; border: 1px solid #333; margin: 8px 0; overflow: hidden; }
    .code-header { background: #2f2f2f; padding: 6px 12px; font-size: 0.75rem; color: #aaa; display: flex; justify-content: space-between; align-items: center; }
    .copy-btn { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 0.75rem; }
    pre { margin: 0; padding: 10px; overflow-x: auto; }
    code { font-family: monospace; font-size: 0.85rem; color: #e6c07b; }

    .input-area { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #212121; padding: 10px 12px; border-top: 1px solid #2f2f2f; z-index: 10; display: flex; align-items: center; justify-content: center; }
    .input-box { width: 100%; max-width: 800px; background: #2f2f2f; border: 1px solid #424242; border-radius: 24px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; }
    textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.9rem; outline: none; resize: none; height: 26px; max-height: 80px; font-family: inherit; line-height: 26px; }

    .tool-btn { background: transparent; border: none; color: #b4b4b4; cursor: pointer; font-size: 1.1rem; }
    .send-btn { background: #fff; color: #000; border: none; padding: 6px 12px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .img-btn { background: #ec4899; color: #fff; border: none; padding: 6px 10px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }

    .audio-btn { background: #333; border: 1px solid #555; color: #ddd; font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; cursor: pointer; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; }
    input[type="file"] { display: none; }
    .preview-img { max-width: 150px; max-height: 150px; border-radius: 8px; margin-top: 6px; }
    .generated-img { width: 100%; max-width: 300px; border-radius: 12px; margin-top: 8px; border: 1px solid #444; display: block; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="menu-btn" onclick="clearChat()">🗑️ Clear</button>
    <span>⚡ Power AI</span>
    <div style="width: 24px;"></div>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="msg-wrapper ai">
      <div class="avatar ai-avatar">AI</div>
      <div class="msg-bubble">Hello! I am <b>Power AI Assistant</b>, created by <b>Rameshwar Kharade</b>. How can I help you today?</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <!-- Photo Upload -->
      <label for="imageInput" class="tool-btn" title="Upload Photo">📷</label>
      <input type="file" id="imageInput" accept="image/*">

      <!-- Doc/PDF File Upload -->
      <label for="docInput" class="tool-btn" title="Upload Document/Text">📄</label>
      <input type="file" id="docInput" accept=".txt,.js,.html,.css,.json,.py,.md">

      <!-- Voice Input -->
      <button class="tool-btn" onclick="startVoice()" title="Voice Input">🎙️</button>

      <textarea id="userInput" placeholder="Type prompt, chat or upload doc..." rows="1" onkeydown="handleEnter(event)"></textarea>
      
      <button class="send-btn" onclick="sendMessage()">Send</button>
      <button class="img-btn" onclick="generateImage()">🎨 Image</button>
    </div>
  </div>

  <script>
    let base64Image = "";
    let mimeType = "image/jpeg";
    let loadedDocText = "";

    window.onload = function() {
      loadHistory();
    };

    function handleEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Photo Attach Listener
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        mimeType = file.type || "image/jpeg";
        const reader = new FileReader();
        reader.onload = function(evt) {
          base64Image = evt.target.result.split(',')[1];
          alert("📸 Photo Selected!");
        };
        reader.readAsDataURL(file);
      }
    });

    // Document Reader Listener
    document.getElementById('docInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          loadedDocText = evt.target.result;
          alert("📄 Document loaded! Ask AI any questions about it.");
        };
        reader.readAsText(file);
      }
    });

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Voice input not supported.");
      const rec = new SpeechRecognition();
      rec.lang = 'mr-IN';
      rec.start();
      rec.onresult = (e) => {
        document.getElementById("userInput").value = e.results[0][0].transcript;
      };
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/<[^>]*>?/gm, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const text = input.value.trim();

      if (!text && !base64Image && !loadedDocText) return;

      let userHtml = text;
      if (loadedDocText) {
        userHtml += `<br><i>[📄 Document Attached]</i>`;
      }
      if (base64Image) {
        userHtml += `<br><img class="preview-img" src="data:${mimeType};base64,${base64Image}">`;
      }

      appendMessage('user', userHtml);

      const imgToSend = base64Image;
      const mimeToSend = mimeType;
      const docToSend = loadedDocText;

      input.value = "";
      base64Image = "";
      loadedDocText = "";
      document.getElementById("imageInput").value = "";
      document.getElementById("docInput").value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, image: imgToSend, mimeType: mimeToSend, docText: docToSend })
        });
        const data = await response.json();

        let rawReply = data.reply || data.error;
        let parsedHtml = marked.parse(rawReply);

        let aiReplyHtml = `
          ${parsedHtml}
          <button class="audio-btn" onclick="speakText(\`${rawReply.replace(/`/g, "'")}\`)">🔊 Listen</button>
        `;

        appendMessage('ai', aiReplyHtml);
        hljs.highlightAll();

      } catch (err) {
        appendMessage('ai', 'Error connecting to server.');
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function generateImage() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const prompt = input.value.trim();

      appendMessage('user', `🎨 Generate: ${prompt || 'Image'}`);

      chatBox.innerHTML += `
        <div class="msg-wrapper ai" id="loadingImg">
          <div class="avatar ai-avatar">AI</div>
          <div class="msg-bubble">Loading Image...</div>
        </div>`;

      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/generate-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: prompt })
        });
        const data = await res.json();
        
        document.getElementById("loadingImg")?.remove();

        if (data.imageUrl) {
          let imgHtml = `Here is your image:<br><img class="generated-img" src="${data.imageUrl}" alt="Generated Image">`;
          appendMessage('ai', imgHtml);
        }
      } catch (err) {
        document.getElementById("loadingImg")?.remove();
        appendMessage('ai', 'Error loading image.');
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(role, htmlContent) {
      const chatBox = document.getElementById("chatBox");
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      if (role === 'user') {
        wrapper.innerHTML = `
          <div class="msg-bubble">${htmlContent}</div>
          <div class="avatar user-avatar">You</div>`;
      } else {
        wrapper.innerHTML = `
          <div class="avatar ai-avatar">AI</div>
          <div class="msg-bubble">${htmlContent}</div>`;
      }

      chatBox.appendChild(wrapper);
      saveHistory();
    }

    function saveHistory() {
      const chatBox = document.getElementById("chatBox");
      localStorage.setItem("power_ai_history", chatBox.innerHTML);
    }

    function loadHistory() {
      const saved = localStorage.getItem("power_ai_history");
      if (saved) {
        document.getElementById("chatBox").innerHTML = saved;
      }
    }

    function clearChat() {
      localStorage.removeItem("power_ai_history");
      document.getElementById("chatBox").innerHTML = `
        <div class="msg-wrapper ai">
          <div class="avatar ai-avatar">AI</div>
          <div class="msg-bubble">Chat cleared!</div>
        </div>`;
    }
  </script>
</body>
</html>
