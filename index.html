<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #212121; color: #ececec; display: flex; flex-direction: column; height: 100vh; }
        header { background: #171717; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; flex-direction: column; max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
        .user-msg { background: #2f2f2f; align-self: flex-end; color: #fff; }
        .ai-msg { background: #171717; align-self: flex-start; color: #ececec; border: 1px solid #333; }
        .controls { display: flex; gap: 8px; margin-top: 8px; }
        .btn-action { background: #333; border: none; color: #aaa; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-action:hover { background: #444; color: #fff; }
        #input-container { padding: 15px; background: #171717; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        textarea { flex: 1; background: #2f2f2f; border: 1px solid #444; border-radius: 20px; padding: 10px 15px; color: #fff; resize: none; outline: none; height: 44px; font-size: 0.95rem; }
        button { background: #673ab7; border: none; color: white; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5e35b1; }
        #mic-btn { background: #00897b; }
    </style>
</head>
<body>

    <header>
        <span>⚡ Power AI (ChatGPT Mode)</span>
        <button class="btn-action" onclick="clearChat()">Clear</button>
    </header>

    <div id="chat-container">
        <div class="message ai-msg">
            <div>नमस्कार! मी Power AI असिस्टंट आहे. मी तुम्हाला कशी मदत करू?</div>
            <div class="controls">
                <button class="btn-action" onclick="speakText(this.parentElement.previousElementSibling.innerText)">🔊 ऐका</button>
            </div>
        </div>
    </div>

    <div id="input-container">
        <button id="mic-btn" onclick="startVoice()">🎙️</button>
        <textarea id="user-input" placeholder="काहीही विचारा..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function speakText(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'mr-IN';
            window.speechSynthesis.speak(speech);
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("व्हॉईस इनपुट या ब्राऊजरमध्ये सपोर्ट करत नाही.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'mr-IN';
            recognition.start();

            recognition.onresult = function(event) {
                userInput.value = event.results[0][0].transcript;
                sendMessage();
            };
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            chatContainer.appendChild(userDiv);
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            const contentDiv = document.createElement('div');
            contentDiv.innerText = 'विचार करत आहे...';
            aiDiv.appendChild(contentDiv);
            chatContainer.appendChild(aiDiv);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                typeEffect(contentDiv, data.reply || data.error || "उत्तर मिळाले नाही.");
            } catch (err) {
                contentDiv.innerText = "सर्व्हरशी संपर्क होऊ शकला नाही.";
            }
        }

        function typeEffect(element, text) {
            element.innerText = '';
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    clearInterval(timer);
                    const controlsDiv = document.createElement('div');
                    controlsDiv.className = 'controls';
                    controlsDiv.innerHTML = `<button class="btn-action" onclick="speakText('${text.replace(/'/g, "\\'")}');">🔊 ऐका</button>`;
                    element.parentElement.appendChild(controlsDiv);
                }
            }, 20);
        }

        function clearChat() {
            chatContainer.innerHTML = '';
        }
    </script>
</body>
</html>
